apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
    name: "{{ .Name }}"
spec:
    gateway: "{{ .Gateway }}"
    hosts:
        - "{{ .Host }}"
    service:
        name: "{{ .ServiceName }}"
        port: {{ .ServicePort }}
    rules:
    - path: {{ .HeadersJwtSecuredPath }}
      methods: {{ .HeadersMethods }}
      jwt:
        authentications:
          - issuer: "{{ .Issuer }}"
            jwksUri: "{{ .JwksUri }}"
    - path: {{ .helloJwtSecuredPath }}
      service:
        name: helloworld-{{.TestID}}
        port: 5000
      methods: {{ .helloMethods }}
      jwt:
        authentications:
          - issuer: "{{ .Issuer }}"
            jwksUri: "{{ .JwksUri }}"
